<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>华安信 | 客户信息汇总</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #1c2d4e 0%, #243a65 50%, #1a3258 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e2e8f0;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,212,255,0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,212,255,0.06) 1px, transparent 1px);
            background-size: 45px 45px;
            pointer-events: none;
            z-index: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header img {
            max-width: 130px;
            height: auto;
            margin-bottom: 14px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #e8edf5;
            margin-bottom: 6px;
        }
        .header p {
            font-size: 13px;
            color: #8898b8;
        }
        .stats-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .stat-card {
            flex: 1;
            background: rgba(40, 55, 85, 0.82);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
        }
        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: #00d4ff;
        }
        .stat-label {
            font-size: 12px;
            color: #8898b8;
            margin-top: 4px;
        }
        .table-card {
            background: rgba(40, 55, 85, 0.82);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 24px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        thead {
            background: rgba(0, 212, 255, 0.1);
        }
        th {
            padding: 14px 12px;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            color: #00d4ff;
            letter-spacing: 0.5px;
        }
        td {
            padding: 12px;
            font-size: 14px;
            color: #c8d4e8;
            border-top: 1px solid rgba(0, 212, 255, 0.08);
        }
        tbody tr:hover {
            background: rgba(0, 212, 255, 0.05);
        }
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #6b7e9e;
            font-size: 14px;
        }
        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .action-btn {
            padding: 12px 28px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }
        .btn-wechat {
            background: linear-gradient(135deg, #00e676, #00c853);
            color: #0a1530;
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.25);
        }
        .btn-wechat:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0, 230, 118, 0.45); }
        .btn-csv {
            background: linear-gradient(135deg, #00d4ff, #0096ff);
            color: #0a1530;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.25);
        }
        .btn-csv:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0, 212, 255, 0.45); }
        .btn-clear {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #ef4444;
        }
        .btn-clear:hover { background: rgba(239, 68, 68, 0.1); }
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(0, 230, 118, 0.95);
            color: #0a1530;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.3s;
            z-index: 100;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .notification.show { transform: translateX(-50%) translateY(0); }
        .note {
            text-align: center;
            font-size: 12px;
            color: rgba(100, 116, 139, 0.6);
            margin-top: 20px;
            line-height: 1.6;
        }
        @media (max-width: 600px) {
            th, td { padding: 10px 8px; font-size: 12px; }
            .stat-number { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="logo.png" alt="华安信 HUAANXIN">
            <h1>客户信息汇总</h1>
            <p>展会客户填写记录</p>
        </div>

        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-number" id="total-count">0</div>
                <div class="stat-label">已填写人数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="today-count">0</div>
                <div class="stat-label">今日新增</div>
            </div>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>序号</th>
                        <th>姓名</th>
                        <th>公司</th>
                        <th>电话</th>
                        <th>提交时间</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="5" class="empty-state">暂无客户数据</td></tr>
                </tbody>
            </table>
        </div>

        <div class="actions">
            <button class="action-btn btn-wechat" onclick="sendToWeChat()">推送到微信</button>
            <button class="action-btn btn-csv" onclick="exportCSV()">导出CSV</button>
            <button class="action-btn btn-clear" onclick="clearData()">清空数据</button>
        </div>

        <p class="note">
            数据存储在当前设备浏览器中。如需跨设备汇总，建议定期导出CSV备份。<br>
            &copy; 华安信 HUAANXIN
        </p>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        var PUSHPLUS_TOKEN = '在此填入你的PushPlus_Token';

        function getSubmissions() {
            try {
                return JSON.parse(localStorage.getItem('huaxin_submissions') || '[]');
            } catch(e) {
                return [];
            }
        }

        function isToday(dateStr) {
            var today = new Date().toLocaleDateString('zh-CN');
            var date = new Date(dateStr);
            return date.toLocaleDateString('zh-CN') === today;
        }

        function renderTable() {
            var data = getSubmissions();
            var tbody = document.getElementById('table-body');
            document.getElementById('total-count').textContent = data.length;

            var todayCount = data.filter(function(d) { return isToday(d.time); }).length;
            document.getElementById('today-count').textContent = todayCount;

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-state">暂无客户数据</td></tr>';
                return;
            }

            var html = '';
            for (var i = 0; i < data.length; i++) {
                html += '<tr>';
                html += '<td>' + (i + 1) + '</td>';
                html += '<td>' + escapeHtml(data[i].name) + '</td>';
                html += '<td>' + escapeHtml(data[i].company) + '</td>';
                html += '<td>' + escapeHtml(data[i].phone) + '</td>';
                html += '<td>' + escapeHtml(data[i].time) + '</td>';
                html += '</tr>';
            }
            tbody.innerHTML = html;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(s) {
                var map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
                return map[s];
            });
        }

        function showNotification(msg) {
            var el = document.getElementById('notification');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(function() { el.classList.remove('show'); }, 3000);
        }

        function sendToWeChat() {
            var data = getSubmissions();
            if (data.length === 0) {
                showNotification('暂无数据可推送');
                return;
            }

            if (PUSHPLUS_TOKEN === '在此填入你的PushPlus_Token' || !PUSHPLUS_TOKEN) {
                showNotification('请先配置 PushPlus Token');
                return;
            }

            var content = '华安信展会客户信息汇总\n\n';
            content += '总人数：' + data.length + ' 人\n';
            content += '今日新增：' + data.filter(function(d){return isToday(d.time)}).length + ' 人\n\n';
            content += '| 序号 | 姓名 | 公司 | 电话 | 时间 |\n';
            content += '|------|------|------|------|------|\n';
            for (var i = 0; i < data.length; i++) {
                content += '| ' + (i+1) + ' | ' + data[i].name + ' | ' + data[i].company + ' | ' + data[i].phone + ' | ' + data[i].time + ' |\n';
            }

            fetch('https://www.pushplus.plus/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    token: PUSHPLUS_TOKEN,
                    title: '华安信展会客户汇总（共' + data.length + '人）',
                    content: content,
                    template: 'markdown'
                })
            }).then(function(res) { return res.json(); })
              .then(function(res) {
                  if (res.code === 200) {
                      showNotification('已推送到微信，请查看');
                  } else {
                      showNotification('推送失败：' + (res.msg || '未知错误'));
                  }
              })
              .catch(function() {
                  showNotification('推送失败，请检查网络');
              });
        }

        function exportCSV() {
            var data = getSubmissions();
            if (data.length === 0) {
                showNotification('暂无数据可导出');
                return;
            }

            var csv = '\uFEFF序号,姓名,公司,电话,提交时间\n';
            for (var i = 0; i < data.length; i++) {
                csv += (i+1) + ',' + csvEscape(data[i].name) + ',' + csvEscape(data[i].company) + ',' + csvEscape(data[i].phone) + ',' + csvEscape(data[i].time) + '\n';
            }

            var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = '华安信展会客户信息_' + new Date().toISOString().slice(0,10) + '.csv';
            a.click();
            URL.revokeObjectURL(url);
            showNotification('CSV已导出');
        }

        function csvEscape(str) {
            if (!str) return '';
            if (str.indexOf(',') >= 0 || str.indexOf('"') >= 0) {
                return '"' + str.replace(/"/g, '""') + '"';
            }
            return str;
        }

        function clearData() {
            if (!confirm('确定要清空所有客户数据吗？此操作不可撤销。')) return;
            localStorage.removeItem('huaxin_submissions');
            localStorage.removeItem('huaxin_customer');
            renderTable();
            showNotification('数据已清空');
        }

        renderTable();
    </script>
</body>
</html>
